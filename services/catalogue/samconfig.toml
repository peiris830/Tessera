# `sam build` / `sam deploy` settings for the Catalogue stack.
# No credentials here: the AWS profile comes from $env:AWS_PROFILE (e.g. tessera-dev).
version = 0.1

[default.global.parameters]
stack_name = "tessera-dev-catalogue"
region = "us-east-1"

[default.build.parameters]
use_container = true # build in AWS's Lambda image: Linux/arm64 binaries (pydantic-core)

[default.deploy.parameters]
parameter_overrides = "Env=dev"
tags = "project=tessera service=catalogue env=dev"
# The stack creates an IAM role (the function's execution role); CloudFormation requires
# an explicit acknowledgement of that.
capabilities = "CAPABILITY_IAM"
# Let SAM create and reuse its own S3 bucket (stack aws-sam-cli-managed-default) for the
# zipped code it uploads before CloudFormation creates the function.
resolve_s3 = true
s3_prefix = "tessera-dev-catalogue"
confirm_changeset = true        # show the change set and wait for "y"
fail_on_empty_changeset = false # re-running with no changes isn't an error
