[tool.pytest.ini_options]
# src/ holds the deployable package (SAM CodeUri); "." lets tests import tests.conftest
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
  "error",  # treat unexpected warnings as failures so they get noticed
  # Mangum calls asyncio.get_event_loop() when constructed; harmless, not our code.
  "ignore:There is no current event loop:DeprecationWarning:mangum",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]  # so `app` and `tests` are sorted as first-party imports

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import order, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
